<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vinyl Ripper</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 2.5em;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 1.1em;
    }

    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #444;
      font-weight: 600;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }

    .file-upload {
      margin-bottom: 15px;
    }

    .file-upload label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 12px;
      border: 2px dashed #ddd;
      border-radius: 6px;
      transition: all 0.3s;
    }

    .file-upload label:hover {
      border-color: #667eea;
      background: #f8f9ff;
    }

    .file-upload input[type="file"] {
      display: none;
    }

    .file-name {
      color: #666;
      font-size: 0.9em;
      margin-top: 5px;
    }

    .file-selected {
      color: #667eea;
      font-weight: 600;
    }

    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 30px;
      padding: 20px;
      border-radius: 6px;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.processing {
      background: #fff3cd;
      border-left: 4px solid #ffc107;
    }

    .status.success {
      background: #d4edda;
      border-left: 4px solid #28a745;
    }

    .status.error {
      background: #f8d7da;
      border-left: 4px solid #dc3545;
    }

    .status h3 {
      margin-bottom: 10px;
      color: #333;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #e0e0e0;
      border-radius: 3px;
      overflow: hidden;
      margin: 15px 0;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      width: 0%;
      transition: width 0.3s;
      animation: progress-animation 1.5s ease-in-out infinite;
    }

    @keyframes progress-animation {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    .track-list {
      margin-top: 15px;
    }

    .track-item {
      padding: 12px;
      background: #f8f9fa;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .track-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .track-waveforms {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    .waveform-container {
      flex: 1;
      background: #1e1e2e;
      border-radius: 4px;
      padding: 8px;
      min-width: 0;
    }

    .waveform-label {
      font-size: 0.75em;
      color: #89b4fa;
      margin-bottom: 4px;
      font-family: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
    }

    .waveform-canvas {
      width: 100%;
      height: 48px;
      display: block;
      border-radius: 2px;
    }

    .track-title {
      font-weight: 600;
      color: #333;
    }

    .track-meta {
      color: #666;
      font-size: 0.9em;
    }

    .confidence {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85em;
      font-weight: 600;
    }

    .confidence.high {
      background: #d4edda;
      color: #155724;
    }

    .confidence.medium {
      background: #fff3cd;
      color: #856404;
    }

    .confidence.low {
      background: #f8d7da;
      color: #721c24;
    }

    /* Processing Log Styles */
    .processing-log {
      margin-top: 20px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      overflow: hidden;
    }

    .processing-log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #f8f9fa;
      border-bottom: 1px solid #e0e0e0;
      cursor: pointer;
      user-select: none;
    }

    .processing-log-header:hover {
      background: #e9ecef;
    }

    .processing-log-header h4 {
      margin: 0;
      color: #444;
      font-size: 0.95em;
    }

    .processing-log-toggle {
      font-size: 0.85em;
      color: #666;
    }

    .processing-log-body {
      max-height: 400px;
      overflow-y: auto;
      padding: 0;
      font-family: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
      font-size: 0.82em;
      line-height: 1.6;
      background: #1e1e2e;
      color: #cdd6f4;
    }

    .processing-log-body.collapsed {
      display: none;
    }

    .log-entry {
      padding: 2px 14px;
      border-left: 3px solid transparent;
    }

    .log-entry.log-heading {
      padding: 8px 14px 4px 14px;
      margin-top: 6px;
      font-weight: 700;
      font-size: 0.95em;
      color: #cba6f7;
      border-left-color: transparent;
      background: rgba(203, 166, 247, 0.08);
    }

    .log-entry.log-info {
      color: #89b4fa;
      border-left-color: #89b4fa;
    }

    .log-entry.log-success {
      color: #a6e3a1;
      border-left-color: #a6e3a1;
    }

    .log-entry.log-warning {
      color: #f9e2af;
      border-left-color: #f9e2af;
    }

    .log-entry.log-error {
      color: #f38ba8;
      border-left-color: #f38ba8;
      font-weight: 600;
    }

    .log-icon {
      margin-right: 6px;
    }

    .auto-filled {
      animation: highlight-fade 2s ease-out;
    }

    @keyframes highlight-fade {
      0% { background-color: #e8f0fe; border-color: #667eea; }
      100% { background-color: transparent; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎵 Vinyl Ripper</h1>
    <p class="subtitle">Convert your vinyl album recordings into individual tracks</p>

    <form id="ripForm">
      <div class="form-group">
        <label for="artist">Artist / Band Name *</label>
        <input type="text" id="artist" name="artist" required placeholder="e.g., The Beatles (auto-filled from Side A filename)">
      </div>

      <div class="form-group">
        <label for="album">Album Title *</label>
        <input type="text" id="album" name="album" required placeholder="e.g., Abbey Road (auto-filled from Side A filename)">
      </div>

      <div class="form-group">
        <label for="outputDir">📂 Output Folder</label>
        <input type="text" id="outputDir" name="outputDir" placeholder="Loading default...">
        <div style="font-size: 0.8em; color: #888; margin-top: 4px;">Album subfolder will be created automatically inside this directory</div>
      </div>

      <div class="form-group">
        <label>Album Sides (Upload 2-4 MP3 files)</label>

        <div class="file-upload">
          <label for="sideA">
            <span>📀 Side A *</span>
          </label>
          <input type="file" id="sideA" name="sideA" accept="audio/mpeg,audio/mp3" required>
          <div class="file-name" id="sideA-name">No file selected</div>
        </div>

        <div class="file-upload">
          <label for="sideB">
            <span>📀 Side B *</span>
          </label>
          <input type="file" id="sideB" name="sideB" accept="audio/mpeg,audio/mp3" required>
          <div class="file-name" id="sideB-name">No file selected</div>
        </div>

        <div class="file-upload">
          <label for="sideC">
            <span>📀 Side C (optional)</span>
          </label>
          <input type="file" id="sideC" name="sideC" accept="audio/mpeg,audio/mp3">
          <div class="file-name" id="sideC-name">No file selected</div>
        </div>

        <div class="file-upload">
          <label for="sideD">
            <span>📀 Side D (optional)</span>
          </label>
          <input type="file" id="sideD" name="sideD" accept="audio/mpeg,audio/mp3">
          <div class="file-name" id="sideD-name">No file selected</div>
        </div>
      </div>

      <button type="submit" id="submitBtn">Start Ripping</button>
    </form>

    <div class="status" id="status">
      <h3 id="statusTitle">Processing...</h3>
      <p id="statusMessage"></p>
      <div class="progress-bar" id="progressBar" style="display: none;">
        <div class="progress-fill"></div>
      </div>
      <div class="track-list" id="trackList"></div>
      <div class="processing-log" id="processingLog" style="display: none;">
        <div class="processing-log-header" id="logToggle">
          <h4>📋 Processing Details</h4>
          <span class="processing-log-toggle" id="logToggleLabel">▼ Show</span>
        </div>
        <div class="processing-log-body collapsed" id="logBody"></div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('ripForm');
    const status = document.getElementById('status');
    const statusTitle = document.getElementById('statusTitle');
    const statusMessage = document.getElementById('statusMessage');
    const progressBar = document.getElementById('progressBar');
    const trackList = document.getElementById('trackList');
    const submitBtn = document.getElementById('submitBtn');
    const processingLogEl = document.getElementById('processingLog');
    const logBody = document.getElementById('logBody');
    const logToggle = document.getElementById('logToggle');
    const logToggleLabel = document.getElementById('logToggleLabel');

    // Toggle processing log
    logToggle.addEventListener('click', () => {
      const isCollapsed = logBody.classList.toggle('collapsed');
      logToggleLabel.textContent = isCollapsed ? '▼ Show' : '▲ Hide';
    });

    // Load default output directory from server config
    (async function loadConfig() {
      try {
        const resp = await fetch('/api/config');
        const cfg = await resp.json();
        const outputDirInput = document.getElementById('outputDir');
        if (cfg.outputDir && !outputDirInput.value.trim()) {
          outputDirInput.value = cfg.outputDir;
          outputDirInput.placeholder = cfg.outputDir;
        }
      } catch (e) {
        // silently fall back to placeholder
        document.getElementById('outputDir').placeholder = 'output';
      }
    })();

    // Parse artist and album from filename like "Artist - Album - Side A.mp3"
    function parseFilename(filename) {
      // Remove extension
      const name = filename.replace(/\.[^.]+$/, '');
      // Split by " - "
      const parts = name.split(/\s*-\s*/);
      if (parts.length >= 2) {
        const artist = parts[0].trim();
        // Check if last part looks like a side label (e.g., "Side A", "Side B")
        const lastPart = parts[parts.length - 1].trim();
        const isSideLabel = /^side\s*[a-dA-D]$/i.test(lastPart);
        // Album is everything between artist and the side label
        const albumParts = isSideLabel ? parts.slice(1, -1) : parts.slice(1);
        const album = albumParts.join(' - ').trim();
        return { artist, album: album || null };
      }
      return null;
    }

    // Handle file input display
    ['sideA', 'sideB', 'sideC', 'sideD'].forEach(sideId => {
      const input = document.getElementById(sideId);
      const display = document.getElementById(`${sideId}-name`);

      input.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
          const fileName = e.target.files[0].name;
          display.textContent = fileName;
          display.classList.add('file-selected');

          // Auto-fill artist and album from Side A filename
          if (sideId === 'sideA') {
            const artistInput = document.getElementById('artist');
            const albumInput = document.getElementById('album');
            const parsed = parseFilename(fileName);
            if (parsed) {
              if (!artistInput.value.trim() && parsed.artist) {
                artistInput.value = parsed.artist;
                artistInput.classList.add('auto-filled');
                setTimeout(() => artistInput.classList.remove('auto-filled'), 2000);
              }
              if (!albumInput.value.trim() && parsed.album) {
                albumInput.value = parsed.album;
                albumInput.classList.add('auto-filled');
                setTimeout(() => albumInput.classList.remove('auto-filled'), 2000);
              }
            }
          }
        } else {
          display.textContent = 'No file selected';
          display.classList.remove('file-selected');
        }
      });
    });

    function renderProcessingLog(entries) {
      if (!entries || entries.length === 0) {
        processingLogEl.style.display = 'none';
        return;
      }

      processingLogEl.style.display = 'block';
      logBody.innerHTML = '';
      logBody.classList.remove('collapsed');
      logToggleLabel.textContent = '▲ Hide';

      const iconMap = {
        heading: '📌',
        info: 'ℹ️',
        success: '✅',
        warning: '⚠️',
        error: '❌'
      };

      for (const entry of entries) {
        const div = document.createElement('div');
        const typeClass = `log-${entry.type || 'info'}`;
        div.className = `log-entry ${typeClass}`;
        const icon = iconMap[entry.type] || 'ℹ️';
        div.innerHTML = `<span class="log-icon">${icon}</span>${escapeHtml(entry.message)}`;
        logBody.appendChild(div);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(form);

      // Show processing status
      status.className = 'status show processing';
      statusTitle.textContent = 'Processing...';
      statusMessage.textContent = 'Uploading files and analyzing audio. This may take several minutes.';
      progressBar.style.display = 'block';
      trackList.innerHTML = '';
      processingLogEl.style.display = 'none';
      logBody.innerHTML = '';
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/rip', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        if (result.success) {
          status.className = 'status show success';
          statusTitle.textContent = '✓ Success!';
          statusMessage.textContent = `Album ripped successfully! ${result.tracks.length} track(s) saved to: ${result.outputDir}`;
          progressBar.style.display = 'none';

          // Display track list with waveforms
          if (result.tracks && result.tracks.length > 0) {
            trackList.innerHTML = '<h4 style="margin-bottom: 10px;">Tracks:</h4>';
            result.tracks.forEach((track, idx) => {
              const confidenceClass = track.confidence > 0.8 ? 'high' : track.confidence > 0.5 ? 'medium' : 'low';
              const confidenceLabel = track.matched ? `${Math.round(track.confidence * 100)}%` : 'No match';

              const hasEndWaveform = track.waveform && track.waveform.end;
              const waveformHtml = track.waveform ? `
                <div class="track-waveforms">
                  <div class="waveform-container">
                    <div class="waveform-label">▶ Start: ${escapeHtml(track.waveform.startLabel || 'first 10s')}</div>
                    <canvas class="waveform-canvas" id="wf-start-${idx}" data-waveform='${JSON.stringify(track.waveform.start)}' data-color="#a6e3a1"></canvas>
                  </div>
                  ${hasEndWaveform ? `
                  <div class="waveform-container">
                    <div class="waveform-label">⏹ End: ${escapeHtml(track.waveform.endLabel || 'last 10s')}</div>
                    <canvas class="waveform-canvas" id="wf-end-${idx}" data-waveform='${JSON.stringify(track.waveform.end)}' data-color="#f9e2af"></canvas>
                  </div>` : ''}
                </div>` : '';

              trackList.innerHTML += `
                <div class="track-item">
                  <div class="track-item-header">
                    <div>
                      <div class="track-title">${track.trackNumber}. ${escapeHtml(track.title)}</div>
                      <div class="track-meta">${formatDuration(track.duration)} — ${escapeHtml(track.fileName)}</div>
                    </div>
                    <span class="confidence ${confidenceClass}">${confidenceLabel}</span>
                  </div>
                  ${waveformHtml}
                </div>
              `;
            });

            // Draw all waveforms after DOM is updated
            requestAnimationFrame(() => drawAllWaveforms());
          }

          // Show processing log
          renderProcessingLog(result.processingLog);
        } else {
          throw { message: result.error || 'Unknown error occurred', processingLog: result.processingLog };
        }
      } catch (error) {
        status.className = 'status show error';
        statusTitle.textContent = '✗ Error';
        statusMessage.textContent = `Failed to rip album: ${error.message}`;
        progressBar.style.display = 'none';
        trackList.innerHTML = '';

        // Show processing log even on error
        renderProcessingLog(error.processingLog);
      } finally {
        submitBtn.disabled = false;
      }
    });

    function formatDuration(seconds) {
      if (!seconds) return '?:??';
      const mins = Math.floor(seconds / 60);
      const secs = Math.round(seconds % 60);
      return `${mins}:${String(secs).padStart(2, '0')}`;
    }

    /**
     * Draw a waveform on a canvas element from amplitude data.
     * Renders mirrored bars (like a typical audio waveform display).
     */
    function drawWaveform(canvas, data, color) {
      if (!canvas || !data || data.length === 0) return;

      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;

      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);

      const w = rect.width;
      const h = rect.height;
      const midY = h / 2;
      const barWidth = Math.max(1, (w / data.length) - 0.5);
      const gap = w / data.length;

      // Clear
      ctx.clearRect(0, 0, w, h);

      // Draw center line
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, midY);
      ctx.lineTo(w, midY);
      ctx.stroke();

      // Normalize: scale so the loudest bar fills the full height,
      // then apply extra gain (3x) to make quieter waveforms more visible
      const maxVal = Math.max(...data, 0.001);
      const gain = Math.min(3.0, 1.0 / maxVal); // auto-gain, capped at 3x

      // Draw bars
      ctx.fillStyle = color || '#a6e3a1';
      for (let i = 0; i < data.length; i++) {
        const amplitude = Math.min(1.0, Math.max(0.01, data[i] * gain)); // normalize + clamp
        const barHeight = amplitude * (midY - 2);
        const x = i * gap;

        // Top half (mirrored)
        ctx.globalAlpha = 0.9;
        ctx.fillRect(x, midY - barHeight, barWidth, barHeight);
        // Bottom half (mirrored, slightly dimmer)
        ctx.globalAlpha = 0.5;
        ctx.fillRect(x, midY, barWidth, barHeight);
      }
      ctx.globalAlpha = 1;
    }

    /**
     * Find and draw all waveform canvases on the page.
     */
    function drawAllWaveforms() {
      document.querySelectorAll('.waveform-canvas').forEach(canvas => {
        try {
          const data = JSON.parse(canvas.dataset.waveform || '[]');
          const color = canvas.dataset.color || '#a6e3a1';
          drawWaveform(canvas, data, color);
        } catch (e) {
          // ignore parse errors
        }
      });
    }
  </script>
</body>
</html>
